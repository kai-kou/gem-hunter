name: Gem Pool Refresh

# Gem 候補プール（public/data/gem-index/ + public/data/daily-digest.json）を
# **日次生成・週次目安反映**するワークフロー（Issue #458・#482・`D-40`）。
#
# 🔴 なぜ「日次実行 / 週次反映」か: 生成物 3.6MB（gzip 1.23MB）は反映（コミット）のたびに
# リポジトリ履歴へ積まれる。Actions 自体の課金はゼロだが、日次で反映するとクローンが年
# +110〜450MB 太りクラウドセッションの clone を重くする。コストの実体は実行頻度ではなく
# 反映頻度にあるため、生成・QA（パイプラインの健全性検証）は毎日行い、実際に main へ反映
# するのは直近の反映コミットから 7 日以上経過した回だけに絞る（`tools/gem_pool_qa.mjs
# --should-publish` が判定・詳細は同ファイルの docstring）。
#
# 決定の正本: content/discussions/gem-pool-actions-schedule-20260823/whiteboard.md（round 3 lead 判定）
# + Issue #482（日次実行・週次反映への変更）。
#
# 🔴 このワークフローは以下を絶対に行わない:
#   - main への直接 push（A-1・docs/rules/user-confirmation-minimization.md §1）
#   - 自動マージ（PR を作るところまで。マージは Claude セッションが既存の回収経路で行う）
#   - Cloudflare へのデプロイ・Workers Builds の再トリガー（PR #460 のレーンに委ねる。SSOT 二重化禁止）
#   - node tools/generate_gem_digest.mjs への --allow-partial-write（孤児シャード削除が不可逆）
#
# 品質担保は本ワークフロー自身が持つ（.claude/hooks/pre-pr-create-check.sh は Actions 発の PR に効かない）。

on:
  schedule:
    # UTC 21:17 = JST 06:17。毎日実行する（反映するかどうかは should-publish 判定が別途決める）。
    # 毎時ちょうど（:00）は GitHub 側の高負荷でキュー投入がドロップされうるため分をずらす
    # （理由・cron の根拠は whiteboard round 3 参照）。
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: '⚠️ 経過日数に関わらず今すぐ main へ反映する（手動デバッグ・緊急更新用）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gem-pool-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 🔴 fetch-depth: 0（全履歴）にする。`tools/gem_pool_qa.mjs --should-publish` が
          # `git log -- public/data/gem-index/index.json` で「直近の反映コミット」を辿るため、
          # 浅いクローンだと反映コミットが取得範囲の外にあった場合に誤って「反映コミットなし」
          # （= 初回相当・反映する）と判定してしまう。日次実行で毎回このパスを触るわけではない
          # ため、浅い固定深度では安全に判定できない。
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          # npm ci は実行しない: tools/gem-pool/*.mjs は Node 組み込みモジュールのみに依存し、
          # 外部 npm パッケージへの依存はゼロ（whiteboard round 1 batch_ops が import 一覧で確認済み）。

      - name: Generate gem pool
        run: node tools/generate_gem_digest.mjs
        # 反映するかどうかに関わらず **毎日** 実行する（パイプラインの健全性を毎日検証するのが
        # この日次実行の目的そのもの）。--allow-partial-write は絶対に付けない（孤児シャード
        # 削除が不可逆）。CLI は失敗時に非ゼロで終了し、部分書き込みは既定で拒否するため、
        # ここで失敗すれば以降のステップ（git add 相当）へは進まない。

      - name: QA check (fail-closed)
        run: |
          set -e
          node tools/gem_pool_qa.mjs --check --json > /tmp/gem_pool_qa.json
          cat /tmp/gem_pool_qa.json
        # 差分パス限定・レジストリのゼロ化/急減・totalCount の急減急増を検査する。これも
        # 反映するかどうかに関わらず毎日実行する（健全性検証）。1 つでも違反すれば非ゼロ終了 →
        # ジョブ失敗 → 反映されない（壊れたデータで PR を開かない）。
        # 🔴 JSON はここで 1 回だけ計算してファイルへ保存する（`set -e` はパイプを介さない単純な
        # リダイレクトなので、node が非ゼロ終了すればこの行自体が失敗しジョブが止まる。標準出力は
        # 失敗前に書き出し済みの内容がそのままファイルに残る）。コミット後に再計算すると HEAD が
        # 新コミットを指してしまい「差分ゼロ・前回比 1.00」という無意味な値になるため、
        # 後続の「Build PR body」ステップはこのファイルを読むだけにし、再計算しない。

      - name: Determine publish decision
        id: publish
        env:
          # workflow_dispatch 以外（schedule）では inputs コンテキストは空になる（force なし扱い）。
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          set -e
          FORCE_FLAG=""
          if [ "${FORCE_PUBLISH}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          # 🔴 日数計算はここに書かない。tools/gem_pool_qa.mjs --should-publish を呼ぶだけにする
          # （YAML 側に判定ロジックの複製を作らない）。
          node tools/gem_pool_qa.mjs --should-publish ${FORCE_FLAG} --json > /tmp/gem_pool_publish.json
          cat /tmp/gem_pool_publish.json
          should_publish="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).should_publish))" "$(cat /tmp/gem_pool_publish.json)")"
          echo "should_publish=${should_publish}" >> "$GITHUB_OUTPUT"
          # 🔴 判定が異常系（git log 失敗）にフォールバックしていたら、ログ上で必ず可視化する
          # （黙って毎日反映へ後退する事態を検知するため。`warning` キーは正常時は存在しない）。
          publish_warning="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).warning || ''))" "$(cat /tmp/gem_pool_publish.json)")"
          if [ -n "${publish_warning}" ]; then
            echo "::warning::gem-pool-refresh 反映判定が異常系にフォールバックしました: ${publish_warning}"
          fi

      - name: No-op check
        id: noop
        if: steps.publish.outputs.should_publish == 'true'
        run: |
          set -e
          result="$(node tools/gem_pool_qa.mjs --no-op --json)"
          echo "result=${result}"
          no_op="$(node -e "process.stdout.write(String(JSON.parse(process.argv[1]).no_op))" "${result}")"
          echo "no_op=${no_op}" >> "$GITHUB_OUTPUT"

      - name: Discard changes (not a publish day)
        if: steps.publish.outputs.should_publish != 'true'
        run: |
          git checkout -- public/data/gem-index public/data/daily-digest.json
          echo "反映しない日（前回の反映から 7 日未満・force_publish なし）。生成・QA の健全性検証のみ実施し、生成物は破棄します。"

      - name: Discard no-op changes
        if: steps.publish.outputs.should_publish == 'true' && steps.noop.outputs.no_op == 'true'
        run: |
          git checkout -- public/data/gem-index public/data/daily-digest.json
          echo "no-op: 実質差分なし。以降のステップをスキップします。"

      - name: Static shard check
        if: steps.publish.outputs.should_publish == 'true' && steps.noop.outputs.no_op != 'true'
        run: python3 tools/check_gem_shards.py

      - name: Commit and push
        if: steps.publish.outputs.should_publish == 'true' && steps.noop.outputs.no_op != 'true'
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -e
          # 🔴 SSOT: このブランチ名は tools/check_pending_pr_reviews.py の AUTOMATION_PR_BRANCH と
          # 同一でなければならない。どちらか片方を変更したら必ずもう片方も直すこと（Issue #458）。
          BRANCH="automation/gem-pool-refresh"
          git checkout -B "${BRANCH}"
          git add public/data/gem-index public/data/daily-digest.json
          git commit -m "data: Gem 候補プールを反映（$(TZ="${PROJECT_TZ:-Asia/Tokyo}" date '+%Y-%m-%d %H:%M %Z')）"
          git push --force origin "${BRANCH}"

      - name: Build PR body
        if: steps.publish.outputs.should_publish == 'true' && steps.noop.outputs.no_op != 'true'
        id: prbody
        run: |
          set -e
          # 🔴 ヒアドキュメントのデリミタは実行ごとに一意にする（Actions の既知の output
          # injection 手口対策）。QA 出力に偶然固定文字列が現れて早期終端すると、以降の行が
          # 任意の key=value として $GITHUB_OUTPUT へ注入されうるため。
          DELIM="GEM_POOL_PR_BODY_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            echo "## Gem 候補プール 定期反映（日次生成・週次目安反映）"
            echo ""
            echo "この PR は GitHub Actions（\`gem-pool-refresh.yml\`）が自動生成しました。マージは Claude セッションが行います。"
            echo ""
            echo "### 反映判定（生成直後に計算したスナップショット）"
            echo '```json'
            cat /tmp/gem_pool_publish.json
            echo '```'
            echo ""
            echo "### QA 結果（生成直後・コミット前に計算したスナップショット）"
            echo '```json'
            cat /tmp/gem_pool_qa.json
            echo '```'
            echo ""
            echo "### totalCount 前回比・レジストリ別件数"
            # 🔴 上と同じ /tmp/gem_pool_qa.json（QA check ステップで 1 回だけ計算済み）の
            # comparison フィールドを読むだけにする。ここで再計算しない
            # （コミット後だと HEAD が新コミットを指し、前回比が消える）。
            node -e "
              const fs = require('node:fs');
              const qa = JSON.parse(fs.readFileSync('/tmp/gem_pool_qa.json', 'utf8'));
              const cmp = qa.comparison ?? { totalCount: {}, registries: [] };
              const t = cmp.totalCount ?? {};
              const ratioLabel = t.ratio != null ? \` （比率 \${t.ratio.toFixed(3)}）\` : '';
              console.log(\`- totalCount: \${t.prev ?? '(初回)'} -> \${t.curr ?? '?'}\${ratioLabel}\`);
              console.log('');
              console.log('| registry | 前回 | 今回 |');
              console.log('|---|---|---|');
              for (const r of cmp.registries ?? []) {
                console.log(\`| \${r.registry} | \${r.prevCount ?? '(新規)'} | \${r.currCount ?? '(消失)'} |\`);
              }
            "
            echo ""
            echo "### 実行時刻"
            echo "$(TZ="${PROJECT_TZ:-Asia/Tokyo}" date '+%Y-%m-%d %H:%M %Z')"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update pull request
        if: steps.publish.outputs.should_publish == 'true' && steps.noop.outputs.no_op != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 🔴 PR 本文（レジストリ名などデータ由来の文字列を含む）を `run:` のシェル内へ
          # `${{ }}` で直接展開しない（スクリプトインジェクションの経路になる・GitHub 公式ガイダンス）。
          # env 経由で渡し、シェル側は変数展開だけで済ませる。
          PR_BODY: ${{ steps.prbody.outputs.body }}
        run: |
          set -e
          # 🔴 SSOT: このブランチ名は tools/check_pending_pr_reviews.py の AUTOMATION_PR_BRANCH と
          # 同一でなければならない。どちらか片方を変更したら必ずもう片方も直すこと（Issue #458）。
          BRANCH="automation/gem-pool-refresh"
          BODY_FILE="$(mktemp)"
          printf '%s' "$PR_BODY" > "${BODY_FILE}"

          # 🔴 コマンド自体の失敗（レート制限・一時的な API エラー）と「0 件ヒット」を区別する。
          # `|| true` で握り潰すと API 失敗を「既存 PR なし」と誤認し、既存 PR があるのに
          # `gh pr create` へ進んで「同一 head/base の PR が既に存在する」で失敗する。
          set +e
          existing_pr="$(gh pr list --head "${BRANCH}" --base main --state open --json number --jq '.[0].number')"
          gh_list_exit=$?
          set -e
          if [ "${gh_list_exit}" -ne 0 ]; then
            echo "::error::gh pr list に失敗しました（exit ${gh_list_exit}）。次回のスケジュール実行に委ねます。" >&2
            exit "${gh_list_exit}"
          fi
          if [ -n "${existing_pr}" ]; then
            gh pr edit "${existing_pr}" --body-file "${BODY_FILE}"
          else
            gh pr create \
              --title "data: Gem 候補プール定期反映" \
              --body-file "${BODY_FILE}" \
              --base main \
              --head "${BRANCH}" \
              --label "type:improvement" \
              --label "status:waiting-claude"
          fi
