# PR ごとのプレビューデプロイ（E-22 / SD-1）
# プレビュー URL が取れなかったら fail-closed で落とす（cloudflare-infrastructure.md §8.2）
name: deploy-preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build

      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
          WRANGLER_SEND_ERROR_REPORTS: false
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          npx wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --tag "$GITHUB_SHA" 2>&1 | tee wrangler-out.log

          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' wrangler-out.log | head -1)
          if [ -z "$URL" ]; then
            echo "::error::wrangler がプレビュー URL を出力しなかった（stdout 形式が変わった可能性）"
            exit 1
          fi

          code=000
          for _ in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL") || code=000
            [ "$code" -lt 500 ] && break
            sleep 5
          done
          if [ "$code" -ge 500 ]; then
            echo "::error::プレビュー URL が $code を返した: $URL"
            exit 1
          fi

          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const url = ${{ toJSON(steps.upload.outputs.url) }}
            const marker = '<!-- preview-url -->'
            const body = `${marker}\n🔗 **プレビュー URL**: ${url}\n\n_このコメントは deploy-preview ワークフローが更新します_`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            const result = existing
              ? await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              : await github.rest.issues.createComment({ owner, repo, issue_number, body })
            if (!result.data?.body?.includes(url)) {
              core.setFailed('プレビュー URL の投稿が反映されなかった')
            }
